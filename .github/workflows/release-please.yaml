---
#
# release-please GitHub Action
#
# documentation:
# - https://github.com/googleapis/release-please-action
# - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax

name: release-please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release-as:
        description: "The version to release as, e.g.: v1.2.3-rc1"
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: release-please (pull request)
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # release-please requires a separate token if it should trigger
          # other actions, see the following link for details:
          # https://github.com/googleapis/release-please-action#other-actions-on-release-please-prs
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .github/release-please-manifest.json
      - name: release-please (manually triggered)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # release-please requires a separate token if it should trigger
          # other actions, see the following link for details:
          # https://github.com/googleapis/release-please-action#other-actions-on-release-please-prs
          # token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .github/release-please-manifest.json
          release-as: inputs.my_input
